name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "Integration/PackageConsumer/**"
      - "scripts/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - ".github/scripts/run-specifications.sh"
      - ".github/scripts/run-specifications.test.mjs"
      - ".github/workflows/dotnet-build.yml"
      - ".globalconfig"
      - ".editorconfig"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Debug
        run: dotnet restore --property:Configuration=Debug

      - name: Build Debug
        run: dotnet build --configuration Debug --no-restore --warnaserror

      - name: Verify specification runner
        run: bash .github/scripts/run-specifications.sh --self-test

      # The version is a sentinel, not a release. Package validation compares assembly versions, and one
      # below the baseline is rejected on that alone before the API surface is ever looked at - so it has to
      # be set on the build, since the pack below reuses what this produces.
      - name: Restore Release
        run: dotnet restore --property:Configuration=Release

      - name: Build Release
        run: dotnet build --no-restore --configuration Release -p:Version=9999.0.0 --warnaserror

      - name: Run specifications
        run: bash .github/scripts/run-specifications.sh Release

      - name: Upload failed specification results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specification-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 3

      # Package validation only runs on pack, so a binary break was invisible until the release failed on
      # main - which is how eight versions came to be tagged with no package on NuGet. Packing here puts the
      # break in the pull request that causes it, which is what Directory.Build.props already claims happens.
      - name: Pack
        run: dotnet pack --no-build --configuration Release -o ./Artifacts/NuGet -p:Version=9999.0.0

      - name: Run clean package consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/critter-stack-consumer-packages
        run: ./scripts/verify-package-consumer.sh 9999.0.0 ./Artifacts/NuGet
